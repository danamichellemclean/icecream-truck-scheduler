  <line x1="196" y1="340" x2="316" y2="340" stroke="#C86800" stroke-width="3" opacity="0.5"/>
  <line x1="210" y1="370" x2="302" y2="370" stroke="#C86800" stroke-width="3" opacity="0.5"/>
  <!-- Cone top edge -->

  <rect x="228" y="155" width="14" height="6" rx="3" fill="#FF6B8A" transform="rotate(-30 235 158)"/>
  <rect x="268" y="170" width="14" height="6" rx="3" fill="#5BB8F5" transform="rotate(20 275 173)"/>
  <rect x="240" y="195" width="14" height="6" rx="3" fill="#A78BFA" transform="rotate(-15 247 198)"/>
  <rect x="275" y="150" width="14" height="6" rx="3" fill="#3D9E6B" transform="rotate(40 282 153)"/>
  <rect x="220" y="210" width="14" height="6" rx="3" fill="#FF8C42" transform="rotate(10 227 213)"/>
